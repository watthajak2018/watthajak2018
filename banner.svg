<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Watthajak Jinasam — Lead Web Developer, Ruby on Rails">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1f"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="1" stop-color="#b3201a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="110" fill="#ff7a6e" font-size="22" font-weight="600" letter-spacing="2">LEAD WEB DEVELOPER · BANGKOK</text>
    <text x="80" y="182" fill="#f4f4f5" font-size="60" font-weight="700">Watthajak Jinasam</text>
    <text x="80" y="236" fill="#a1a1aa" font-size="26">Ruby on Rails and PostgreSQL for recruitment software, since 2018.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#d4d4d8">
      <rect x="80" y="282" width="94" height="38" rx="19" fill="#26262b"/><text x="98" y="307">Rails</text>
      <rect x="186" y="282" width="140" height="38" rx="19" fill="#26262b"/><text x="204" y="307">PostgreSQL</text>
      <rect x="338" y="282" width="94" height="38" rx="19" fill="#26262b"/><text x="356" y="307">RSpec</text>
      <rect x="444" y="282" width="104" height="38" rx="19" fill="#26262b"/><text x="462" y="307">Docker</text>
      <rect x="560" y="282" width="104" height="38" rx="19" fill="#26262b"/><text x="578" y="307">Heroku</text>
    </g>
  </g>
  <!-- ruby gem mark -->
  <g transform="translate(930 80)">
    <polygon points="70,0 170,0 240,70 120,240 0,70" fill="url(#ruby)"/>
    <polygon points="70,0 120,70 170,0" fill="#ff8d82" opacity=".55"/>
    <polygon points="0,70 120,70 120,240" fill="#7a120e" opacity=".35"/>
    <polyline points="0,70 240,70" stroke="#ffd2cd" stroke-opacity=".5" stroke-width="2" fill="none"/>
  </g>
</svg>
